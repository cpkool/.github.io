    pinned: true
    logo: /img/niu.png
    
    # your sub-pages
    left:
     
      - text: "Research"
        href: Research/researchindex.qmd
      - text: "Teaching"
        href: Teaching/teachingindex.qmd
      - text: "CV"
        href: cv/index.qmd
      - text: "Students"
        href: Students/studindex.qmd
    
    # your social media handles
    right:
      - icon: bluesky
        href: https://bsky.app/profile/profkuehl.bsky.social
      - icon: envelope
        aria-label: email
        href: "mailto:ckuehl@niu.edu"  
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
 

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme:
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true