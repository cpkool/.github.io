# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Colin Kuehl" 
  google-analytics: "G-8DT4TTTYK2"
  
  # Your name
  description: "Associate Professor of Political Science and Environmental Studies"   # A brief slogan (optional)
  image: img/bridge1.png
  
  favicon: img/niu.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: /img/niu.png
    
    # your sub-pages
    left:
     
      - text: "Research"
        href: Research/researchindex.qmd
      - text: "Teaching"
        href: Teaching/teachingindex.qmd
      - text: "CV"
        href: cv/index.qmd
      - text: "Students"
        href: Students/studindex.qmd
    
    # your social media handles
    right:
      - icon: bluesky
        href: https://bsky.app/profile/profkuehl.bsky.social
      - icon: envelope
        aria-label: email
        href: "mailto:ckuehl@niu.edu"  
  
  

  page-footer:
    left: "© Colin Kuehl"
    right: 'Last updated <span id="last-updated"></span>'

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
 

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme:
      dark: [pulse, html/styles.scss]
      light: [pulse, html/styles-light.scss]
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true
    include-after-body:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", function () {
          var el = document.getElementById("last-updated");
          if (!el) return;
          var d = new Date(document.lastModified);
          if (isNaN(d)) return;
          el.textContent = d.toLocaleDateString("en-US", { month: "long", year: "numeric" });
        });
        </script>